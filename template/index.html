<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hayvan Tanıma</title>

    <style>
        body {
            font: 16px system-ui;
            background: #eef3ef;
            color: #183329;
            margin: 0;
        }

        main {
            max-width: 620px;
            margin: 55px auto;
            padding: 30px;
            background: white;
            border-radius: 24px;
        }

        h1 { font-size: 32px; }
        p { line-height: 1.6; color: #52665b; }
        label { display: block; margin: 24px 0; }

        select {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #b2c6b8;
            border-radius: 10px;
            font: inherit;
        }

        .upload {
            border: 2px dashed #b2c6b8;
            border-radius: 16px;
            padding: 24px;
        }

        input { max-width: 100%; }

        button {
            background: #246348;
            color: white;
            border: 0;
            border-radius: 12px;
            padding: 14px 24px;
            font: inherit;
            cursor: pointer;
        }

        button:disabled { opacity: 0.5; cursor: wait; }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 300px;
            margin: 20px auto;
            border-radius: 14px;
        }

        #error { color: #a52d28; }
        .row { margin: 20px 0; }
        .row span { float: right; }

        progress {
            width: 100%;
            height: 16px;
            accent-color: #246348;
        }

        small { color: #64766b; }

        @media (max-width: 680px) {
            main { margin: 20px 12px; padding: 22px; }
        }
    </style>
</head>

<body>
<main>
    <h1>Hangi hayvan?</h1>
    <p>Modelini seç, fotoğrafını yükle ve en olası üç tahmini gör.</p>

    <form id="form">
        <label>
            Model
            <select id="model" disabled>
                <option>Modeller yükleniyor…</option>
            </select>
        </label>

        <label class="upload">
            Hayvan fotoğrafı seç
            <br><br>
            <input
                id="file"
                type="file"
                accept="image/jpeg,image/png,image/webp"
                required
            >
        </label>

        <img id="preview" alt="Seçilen fotoğraf">

        <button id="button" type="submit" disabled>
            Fotoğrafı analiz et
        </button>
    </form>

    <p id="error" role="alert"></p>
    <section id="result" aria-live="polite"></section>

    <small>
        Model yalnızca eğitildiği hayvan sınıflarından seçim yapar.
        Olasılıklar doğruluk garantisi değildir.
    </small>
</main>

<script>
    const form = document.querySelector("#form");
    const file = document.querySelector("#file");
    const button = document.querySelector("#button");
    const select = document.querySelector("#model");
    const preview = document.querySelector("#preview");
    const result = document.querySelector("#result");
    const error = document.querySelector("#error");

    let previewUrl;

    async function loadModels() {
        try {
            const response = await fetch("/models");

            if (!response.ok) {
                throw new Error("Model listesi alınamadı.");
            }

            const data = await response.json();
            select.replaceChildren();

            let firstAvailable = null;

            for (const model of data.models) {
                const option = document.createElement("option");

                // Değer: transfer_learning veya basic
                option.value = model.id;
                option.textContent = model.name;
                option.disabled = !model.available;

                if (!model.available) {
                    option.textContent += " — " + model.reason;
                }

                select.append(option);

                if (model.available && firstAvailable === null) {
                    firstAvailable = model.id;
                }
            }

            if (firstAvailable !== null) {
                select.value = firstAvailable;
                select.disabled = false;
                button.disabled = false;
            } else {
                error.textContent =
                    "Kullanılabilir model yok. Model dosyasını kontrol et.";
            }

        } catch (err) {
            error.textContent = err.message;
        }
    }

    select.addEventListener("change", () => {
        result.replaceChildren();
        error.textContent = "";
    });

    file.addEventListener("change", () => {
        result.replaceChildren();
        error.textContent = "";

        if (previewUrl) {
            URL.revokeObjectURL(previewUrl);
        }

        const photo = file.files[0];

        preview.style.display = photo ? "block" : "none";

        if (photo) {
            previewUrl = URL.createObjectURL(photo);
            preview.src = previewUrl;
        }
    });

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        result.replaceChildren();
        error.textContent = "";

        const photo = file.files[0];

        if (!photo) return;

        if (photo.size > 10 * 1024 * 1024) {
            error.textContent = "Fotoğraf en fazla 10 MB olabilir.";
            return;
        }

        button.disabled = true;
        select.disabled = true;
        button.textContent = "Analiz ediliyor…";

        try {
            const data = new FormData();

            data.append("file", photo);

            // app.py'deki model_type parametresine gönderilir.
            data.append("model_type", select.value);

            const response = await fetch("/predict", {
                method: "POST",
                body: data
            });

            const body = await response.json();

            if (!response.ok) {
                throw new Error(
                    typeof body.detail === "string"
                        ? body.detail
                        : "Fotoğraf işlenemedi."
                );
            }

            const modelNote = document.createElement("p");
            modelNote.textContent = "Kullanılan model: " + body.model_name;

            const title = document.createElement("h2");
            title.textContent = "En olası: " + body.prediction;

            result.append(modelNote, title);

            for (const prediction of body.top_predictions) {
                const row = document.createElement("div");
                row.className = "row";

                const name = document.createElement("strong");
                name.textContent = prediction.class_name;

                const percentage = document.createElement("span");
                percentage.textContent =
                    (prediction.probability * 100).toFixed(1) + "%";

                const bar = document.createElement("progress");
                bar.max = 1;
                bar.value = prediction.probability;

                row.append(name, percentage, bar);
                result.append(row);
            }

        } catch (err) {
            error.textContent = err.message;

        } finally {
            button.disabled = false;
            select.disabled = false;
            button.textContent = "Fotoğrafı analiz et";
        }
    });

    loadModels();
</script>
</body>
</html>
