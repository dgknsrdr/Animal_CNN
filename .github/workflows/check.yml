name: Check project

on: [push, pull_request, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q main.py animal_model.py training_testing.py

      - name: Check model prediction
        run: |
          python - <<'PY'
          import torch
          from animal_model import AnimalModel

          model = AnimalModel()
          model.eval()

          x = torch.randn(2, 3, 128, 128)

          with torch.inference_mode():
              output = model(x)

          assert output.shape == (2, 45), output.shape
          assert torch.isfinite(output).all()

          print("Model prediction passed:", output.shape)
          PY